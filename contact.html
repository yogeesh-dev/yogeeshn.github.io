    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="starfield"></canvas>
    <div class="nebula-layer"><span class="neb-1"></span><span class="neb-2"></span><span class="neb-3"></span></div>
    <div class="bg-vignette"></div>

    <nav id="nav">
        <a href="index.html" class="nav-brand">Yogeesh <span>N</span></a>
        <div class="nav-links">
            <a href="works.html" class="nav-link nav-works">Works</a>
            <a href="research.html" class="nav-link nav-research">Research</a>
            <a href="conferences.html" class="nav-link nav-conf">Conferences</a>
            <a href="education.html" class="nav-link nav-edu">Education</a>
            <a href="contact.html" class="nav-link nav-contact active" style="--current-accent: var(--accent);">Contact</a>
        </div>
    </nav>

    <div class="container">
        <header class="page-header">
            <span class="eyebrow" style="color: var(--accent);">Say hello</span>
            <h1>Get in Touch</h1>
            <p class="lede">Have a question about my astrophysics research, or just want to say hi? Send a message.</p>
        </header>

        <div class="contact-wrap" style="margin-top: 3rem;">
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <div class="field">
                    <label for="name">Your name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="field">
                    <label for="email">Your email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="glow-btn glow-btn--amber glow-btn--block">
                    <span class="blob"></span>
                    <span class="inner">Send message</span>
                </button>
            </form>
            <p class="contact-alt">or reach out directly via <a href="https://www.linkedin.com/in/yogeesh-n-95727520b/" target="_blank" rel="noopener">LinkedIn</a></p>
        </div>
    </div>

    <footer>designed &amp; built for Yogeesh N · updated 2026</footer>

    <script src="background.js"></script>
    <script src="main.js"></script>
